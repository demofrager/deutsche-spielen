{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h2>Games</h2>
  <p>Choose a game to start practicing.</p>
  <div class="game-grid">
    {% for game in games %}
    <article class="game-card">
      <h3>{{ game.title }}</h3>
      <p>{{ game.description }}</p>
      <a class="button" href="{{ game.path }}">Open game</a>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
